<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darkum Design | داركم — Custom Furniture, Coming Soon</title>
<meta name="description" content="Darkum Design — custom furniture, crafted for you. Our website is coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Cairo:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="grain"></div>

  <button id="lang-toggle" class="lang-toggle" aria-label="Toggle language">EN / عربي</button>

  <main class="wrap">

    <div class="mark">
      <span class="mark-line"></span>
      <span class="mark-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M10 44 L10 22 Q10 16 16 16 L48 16 Q54 16 54 22 L54 44" />
          <path d="M8 44 L56 44" />
          <path d="M12 44 L12 52 M52 44 L52 52" />
          <path d="M10 30 L54 30" />
        </svg>
      </span>
      <span class="mark-line"></span>
    </div>

    <h1 class="brand">
      <span class="brand-en" data-en="Darkum Design" data-ar="داركم">Darkum Design</span>
    </h1>

    <p class="tagline" data-en="Custom furniture, crafted for you." data-ar="أثاث مخصص، صُنع خصيصًا لك.">
      Custom furniture, crafted for you.
    </p>

    <div class="divider"><span></span></div>

    <p class="coming-soon" data-en="Our new home is being built." data-ar="بيتنا الجديد قيد الإنشاء.">
      Our new home is being built.
    </p>

    <form id="notify-form" class="notify-form" novalidate>
      <label for="email" class="sr-only">Email address</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        data-en-placeholder="Enter your email"
        data-ar-placeholder="أدخل بريدك الإلكتروني"
        placeholder="Enter your email"
        autocomplete="email"
      >
      <button type="submit" data-en="Notify Me" data-ar="أعلمني">Notify Me</button>
    </form>

    <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

    <div class="socials" aria-label="Social links">
      <a href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.8" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" aria-label="Facebook">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 9h3V6h-3c-1.7 0-3 1.3-3 3v2H9v3h2v6h3v-6h3l1-3h-4V9c0-.6.4-1 1-1Z"/></svg>
      </a>
      <a href="#" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.7-1.2A9 9 0 1 0 12 3Z"/><path d="M8.5 8.7c.2-.5.5-.5.8-.5h.6c.2 0 .4 0 .6.5s.7 1.7.8 1.8c.1.2.1.4 0 .6-.1.2-.2.3-.4.5-.2.2-.4.4-.2.7.2.4 1 1.5 2.1 2.1.3.2.5.1.7-.1.2-.2.7-.8.9-1 .2-.2.4-.2.6-.1s1.6.7 1.9.9c.3.1.4.2.5.3.1.2.1.9-.2 1.4-.3.5-1.5 1.1-2.1 1.1-.6 0-1.8-.2-3.6-1.4-2.1-1.5-3.4-3.6-3.6-3.9-.2-.3-1-1.4-1-2.6 0-1.2.6-1.8.8-2Z"/></svg>
      </a>
    </div>

    <p class="footer-note">
      <span data-en="© " data-ar="© ">© </span><span id="year"></span>
      <span data-en=" Darkum Design. All rights reserved." data-ar=" داركم. جميع الحقوق محفوظة.">
        Darkum Design. All rights reserved.
      </span>
    </p>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
